name: Live smoke test

# Runs after Render reports a successful deploy (Render posts GitHub
# deployment statuses), and on demand.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet httpx
      - name: Smoke test the live API
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          test -n "$API_URL" || { echo "RENDER_API_URL variable is not set"; exit 1; }
          python server/scripts/smoke_test_live.py "$API_URL" --origin https://skyvault.pages.dev
