name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache DE421 kernel
        uses: actions/cache@v4
        with:
          path: server/data/de421.bsp
          key: de421-v1
      # No-op when the cached kernel is present.
      - run: python scripts/download_ephemeris.py
      # network-marked tests (live Photon/SIMBAD/NASA) stay excluded via pytest.ini
      - run: python -m pytest -q
      - run: python -m scripts.verify_bright_stars
      - run: python scripts/verify_backdrop_projection.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
